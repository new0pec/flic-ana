<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chegadas</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --border:#2d3a4d; --text:#e8eef6; --muted:#8b9bb4; --accent:#3b82f6; --arrived:#22c55e; --canceled:#ef4444; }
  *{box-sizing:border-box;} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;line-height:1.4;}
  h1{font-size:1.6rem;margin:0 0 16px;} .container{max-width:1400px;margin:0 auto;}
  .toolbar{display:flex;gap:12px;margin-bottom:16px;align-items:flex-end;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:200px;display:flex;align-items:center;}
  input[type=search]{background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 48px 14px 16px;border-radius:10px;width:100%;font-size:16px;text-transform:uppercase;}
  #clearBtn{position:absolute;right:8px;background:none;border:none;color:#8b9bb4;font-size:28px;cursor:pointer;padding:4px 8px;line-height:1;}
  .filter-box{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:0.75rem;color:var(--muted);}
  .ios-switch{position:relative;display:inline-block;width:51px;height:31px;}
  .ios-switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#39393d;transition:.3s;border-radius:31px;}
  .slider:before{position:absolute;content:"";height:27px;width:27px;left:2px;bottom:2px;background:white;transition:.3s;border-radius:50%;}
  input:checked + .slider{background:#34c759;}
  input:checked + .slider:before{transform:translateX(20px);}
  #refreshBtn{background:#374151;color:white;border:none;padding:14px 18px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;align-self:flex-end;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:12px 20px;border-radius:8px;font-weight:600;display:none;z-index:1000;}
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);max-height:80vh;overflow-y:auto;} table{width:100%;border-collapse:collapse;font-size:0.85rem;} th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;} th{background:#1e293b;color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1;} tr{cursor:pointer;} tr:hover{background:#1e293b;} tr.selected{background:#1e3a5f;} .remarks.ARRIVED{color:var(--arrived);} .remarks.CANCELED{color:var(--canceled);} footer{margin-top:20px;font-size:0.75rem;color:var(--muted);text-align:center;} .no-results,.loading{padding:20px;text-align:center;color:var(--muted);}
  .hl{background:#86efac;color:#0f1419;border-radius:3px;padding:0 2px;}
</style>
</head>
<body>
<div class="container">
  <h1>Chegadas</h1>
  <div class="toolbar">
    <div class="search-wrap">
      <input type="search" id="search">
      <button id="clearBtn" title="Limpar">×</button>
    </div>
    <button id="refreshBtn">Refresh</button>
    <div class="filter-box">
      <span>Filtrar</span>
      <label class="ios-switch">
        <input type="checkbox" id="filterToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <div class="table-wrap">
    <table id="flightsTable"><thead><tr><th>Voo</th><th>Origem</th><th>Matrícula</th><th>Stand</th><th>ATA</th><th>Estado</th></tr></thead><tbody id="tbody"><tr><td colspan="6" class="loading">A carregar dados do FLIC...</td></tr></tbody></table>
  </div>
</div>
<div class="toast" id="toast">Copiado!</div>
<script>
const PROXY='https://proxy.cors.dev/';
const FLIC_URL='https://flic.tap.pt/FLIC_UI/FLIC.aspx?id=CPOR-LISC1-12h_ARR';
const ANA_URL='https://busdriverlis.ana.pt/pt/bus-driver/search';
const HIDDEN_STANDS=['141','142','143','144','145','146','147','114','115','116','117','122','123','124','125','126'];
const HIDDEN_ORIGINS=['YYZ','BOS','IAD','MIA','EWR','DSS','LAX','GIG','REC','SSA','GRU','NBJ','VCP','JFK','LHR','NAT','DUB','DXB'];
let allFlights=[],selected=null,filterActive=false;
function highlight(text,q){if(!q||!text)return text||'';const idx=String(text).toUpperCase().indexOf(q.toUpperCase());if(idx===-1)return text;return text.slice(0,idx)+'<span class="hl">'+text.slice(idx,idx+q.length)+'</span>'+text.slice(idx+q.length);}
async function loadFlights(){const tbody=document.getElementById('tbody');tbody.innerHTML='<tr><td colspan="6" class="loading">A atualizar dados do FLIC...</td></tr>';try{const response=await fetch(PROXY+FLIC_URL);if(!response.ok)throw new Error('HTTP '+response.status);const html=await response.text();const dateMatch=html.match(/(\d{2})(\w{3})(\d{2})\s+(\d{2}):(\d{2})/);let pageDate=new Date();if(dateMatch){const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};const day=parseInt(dateMatch[1]),mon=months[dateMatch[2]]||10,year=2000+parseInt(dateMatch[3]);pageDate=new Date(year,mon,day);}const parser=new DOMParser(),doc=parser.parseFromString(html,'text/html'),rows=Array.from(doc.querySelectorAll('tr')),flights=[];for(const tr of rows){const cells=Array.from(tr.querySelectorAll('td')).map(td=>td.innerText.trim());if(cells.length>=4&&cells[0]&&cells[1]&&/^[A-Z0-9]{2,3}$/.test(cells[0])&&/^\d+$/.test(cells[1])){const sta=cells[6]||'',eta=cells[7]||'',ata=cells[8]||'';const timeStr=ata||eta||sta;let flightTime=null;if(timeStr&&/^\d{2}:\d{2}$/.test(timeStr)){const [h,m]=timeStr.split(':').map(Number);flightTime=new Date(pageDate);flightTime.setHours(h,m,0,0);const now=new Date();if(flightTime.getTime()>now.getTime()+12*60*60*1000){flightTime.setDate(flightTime.getDate()-1);}}flights.push({airline:cells[0],number:cells[1],origin:cells[2]||'',registration:cells[3]||'',eqt:cells[4]||'',stand:cells[5]||'',sta,eta,ata,remarks:cells[9]||'',link:cells[10]||'',std:cells[11]||'',fullFlight:cells[0]+cells[1],flightTime});}}const now=new Date(),cutoff=new Date(now.getTime()-3*60*60*1000);allFlights=flights.filter(f=>!f.flightTime||f.flightTime>=cutoff);renderTable(getFiltered());}catch(err){tbody.innerHTML=`<tr><td colspan="6" class="no-results">Erro ao carregar dados do FLIC: ${err.message}</td></tr>`;}}
function renderTable(list){const tbody=document.getElementById('tbody');const q=(document.getElementById('search').value||'').toUpperCase().trim();if(!list||list.length===0){tbody.innerHTML='<tr><td colspan="6" class="no-results">Nenhum voo encontrado</td></tr>';return;}tbody.innerHTML=list.map((f,i)=>{const reg=f.registration||'';const regLast3=reg.slice(-3);const hlReg=(q.length===3&&regLast3===q)?reg.slice(0,-3)+'<span class="hl">'+regLast3+'</span>':highlight(reg,q);return `<tr data-idx="${i}" class="${selected&&selected.fullFlight===f.fullFlight?'selected':''}"><td><strong>${highlight(f.fullFlight||'',q)}</strong></td><td>${highlight(f.origin||'',q)}</td><td>${hlReg||'—'}</td><td>${highlight(f.stand||'',q)}</td><td>${f.ata||''}</td><td class="remarks ${f.remarks||''}">${highlight(f.remarks||'',q)}</td></tr>`;}).join('');}
function showToast(msg){const toast=document.getElementById('toast');toast.textContent=msg;toast.style.display='block';setTimeout(()=>toast.style.display='none',1500);}
function selectFlight(f){selected=f;const text=`${f.fullFlight}|${f.registration||''}|${f.origin||''}`;navigator.clipboard.writeText(text).then(()=>{showToast(`Copiado: ${text}`);window.open(ANA_URL,'_blank');}).catch(()=>{showToast('Erro ao copiar');window.open(ANA_URL,'_blank');});renderTable(getFiltered());}
function getFiltered(){let list=allFlights;if(filterActive){list=list.filter(f=>!HIDDEN_STANDS.includes(String(f.stand||'').trim())&&!HIDDEN_ORIGINS.includes(String(f.origin||'').trim().toUpperCase()));}const searchEl=document.getElementById('search'),q=(searchEl?searchEl.value:'').toUpperCase().trim();if(!q)return list;return list.filter(f=>{const flight=(f.fullFlight||'').toUpperCase(),origin=(f.origin||'').toUpperCase(),reg=(f.registration||'').toUpperCase(),remarks=(f.remarks||'').toUpperCase();const regLast3=reg.slice(-3);if(q.length===3&&regLast3===q)return true;return flight.includes(q)||origin.includes(q)||reg.includes(q)||remarks.includes(q);});}
document.getElementById('tbody').addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr||!tr.dataset.idx)return;const idx=parseInt(tr.dataset.idx,10),list=getFiltered();if(list[idx])selectFlight(list[idx]);});
const searchInput=document.getElementById('search');
searchInput.addEventListener('input',()=>{searchInput.value=searchInput.value.toUpperCase();renderTable(getFiltered());});
document.getElementById('clearBtn').addEventListener('click',()=>{searchInput.value='';renderTable(getFiltered());searchInput.focus();});
document.getElementById('filterToggle').addEventListener('change',e=>{filterActive=e.target.checked;renderTable(getFiltered());});
document.getElementById('refreshBtn').addEventListener('click',()=>{loadFlights();});
loadFlights();
</script>
</body>
</html>
