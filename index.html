<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chegadas</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --border:#2d3a4d; --text:#e8eef6; --muted:#8b9bb4; --accent:#3b82f6; --arrived:#22c55e; --canceled:#ef4444; }
  *{box-sizing:border-box;} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;line-height:1.4;}
  h1{font-size:1.6rem;margin:0 0 16px;} .container{max-width:1400px;margin:0 auto;}
  .toolbar{margin-bottom:16px;} input[type=search]{background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:10px;width:100%;font-size:16px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:12px 20px;border-radius:8px;font-weight:600;display:none;z-index:1000;}
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);max-height:80vh;overflow-y:auto;} table{width:100%;border-collapse:collapse;font-size:0.85rem;} th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;} th{background:#1e293b;color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1;} tr{cursor:pointer;} tr:hover{background:#1e293b;} tr.selected{background:#1e3a5f;} .remarks.ARRIVED{color:var(--arrived);} .remarks.CANCELED{color:var(--canceled);} footer{margin-top:20px;font-size:0.75rem;color:var(--muted);text-align:center;} .no-results,.loading{padding:20px;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<div class="container">
  <h1>Chegadas</h1>
  <div class="toolbar"><input type="search" id="search" placeholder="Procurar voo, origem, matrícula..."></div>
  <div class="table-wrap">
    <table id="flightsTable"><thead><tr><th>Voo</th><th>Origem</th><th>Matrícula</th><th>EQT</th><th>Stand</th><th>STA</th><th>ETA</th><th>ATA</th><th>Estado</th><th>Link</th><th>STD</th></tr></thead><tbody id="tbody"><tr><td colspan="11" class="loading">A carregar dados do FLIC...</td></tr></tbody></table>
  </div>
  <footer>Dados obtidos em tempo real do FLIC TAP. Clica num voo para copiar.</footer>
</div>
<div class="toast" id="toast">Copiado!</div>
<script>
const PROXY='https://proxy.cors.dev/';
const FLIC_URL='https://flic.tap.pt/FLIC_UI/FLIC.aspx?id=CPOR-LISC1-12h_ARR';
let allFlights=[],selected=null;
async function loadFlights(){const tbody=document.getElementById('tbody');try{const response=await fetch(PROXY+FLIC_URL);if(!response.ok)throw new Error('HTTP '+response.status);const html=await response.text();const dateMatch=html.match(/(\d{2})(\w{3})(\d{2})\s+(\d{2}):(\d{2})/);let pageDate=new Date();if(dateMatch){const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};const day=parseInt(dateMatch[1]),mon=months[dateMatch[2]]||10,year=2000+parseInt(dateMatch[3]);pageDate=new Date(year,mon,day);}const parser=new DOMParser(),doc=parser.parseFromString(html,'text/html'),rows=Array.from(doc.querySelectorAll('tr')),flights=[];for(const tr of rows){const cells=Array.from(tr.querySelectorAll('td')).map(td=>td.innerText.trim());if(cells.length>=4&&cells[0]&&cells[1]&&/^[A-Z0-9]{2,3}$/.test(cells[0])&&/^\d+$/.test(cells[1])){const sta=cells[6]||'',eta=cells[7]||'',timeStr=eta||sta;let flightTime=null;if(timeStr&&/^\d{2}:\d{2}$/.test(timeStr)){const [h,m]=timeStr.split(':').map(Number);flightTime=new Date(pageDate);flightTime.setHours(h,m,0,0);if(h<6&&pageDate.getHours()>18)flightTime.setDate(flightTime.getDate()+1);}flights.push({airline:cells[0],number:cells[1],origin:cells[2]||'',registration:cells[3]||'',eqt:cells[4]||'',stand:cells[5]||'',sta,eta,ata:cells[8]||'',remarks:cells[9]||'',link:cells[10]||'',std:cells[11]||'',fullFlight:cells[0]+cells[1],flightTime});}}const now=new Date(),cutoff=new Date(now.getTime()-3*60*60*1000);allFlights=flights.filter(f=>{const notArrived=!f.ata&&!String(f.remarks||'').toUpperCase().includes('ARRIVED');return notArrived||!f.flightTime||f.flightTime>=cutoff;});renderTable(getFiltered());}catch(err){tbody.innerHTML=`<tr><td colspan="11" class="no-results">Erro ao carregar dados do FLIC: ${err.message}</td></tr>`;}}
function renderTable(list){const tbody=document.getElementById('tbody');if(!list||list.length===0){tbody.innerHTML='<tr><td colspan="11" class="no-results">Nenhum voo encontrado</td></tr>';return;}tbody.innerHTML=list.map((f,i)=>`<tr data-idx="${i}" class="${selected&&selected.fullFlight===f.fullFlight?'selected':''}"><td><strong>${f.fullFlight||''}</strong></td><td>${f.origin||''}</td><td>${f.registration||'—'}</td><td>${f.eqt||''}</td><td>${f.stand||''}</td><td>${f.sta||''}</td><td>${f.eta||''}</td><td>${f.ata||''}</td><td class="remarks ${f.remarks||''}">${f.remarks||''}</td><td>${f.link||''}</td><td>${f.std||''}</td></tr>`).join('');}
function showToast(msg){const toast=document.getElementById('toast');toast.textContent=msg;toast.style.display='block';setTimeout(()=>toast.style.display='none',1500);}
function selectFlight(f){selected=f;const text=`${f.fullFlight}|${f.registration||''}|${f.origin||''}`;navigator.clipboard.writeText(text).then(()=>showToast(`Copiado: ${text}`)).catch(()=>showToast('Erro ao copiar'));renderTable(getFiltered());}
function getFiltered(){const searchEl=document.getElementById('search'),q=(searchEl?searchEl.value:'').toLowerCase().trim();if(!q)return allFlights;return allFlights.filter(f=>{const flight=(f.fullFlight||'').toLowerCase(),origin=(f.origin||'').toLowerCase(),reg=(f.registration||'').toLowerCase(),remarks=(f.remarks||'').toLowerCase();return flight.includes(q)||origin.includes(q)||reg.includes(q)||remarks.includes(q);});}
document.getElementById('tbody').addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr||!tr.dataset.idx)return;const idx=parseInt(tr.dataset.idx,10),list=getFiltered();if(list[idx])selectFlight(list[idx]);});
document.getElementById('search').addEventListener('input',()=>renderTable(getFiltered()));
loadFlights();
</script>
</body>
</html>
