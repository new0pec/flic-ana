<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chegadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0B1B33">
<script>(function(){var h=new Date().getHours();document.documentElement.dataset.theme=(h>=7&&h<19)?'day':'night';})();</script>
<meta name="apple-mobile-web-app-title" content="Chegadas">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root{
    --night:#0B1B33;          /* céu noturno sobre a placa */
    --amber:#F5A524;          /* luz dos projetores da placa */
    --runway:#2F6BFF;         /* luzes azuis de bordo de caminho de circulação */
    --glass:rgba(8,18,38,.58);/* vidro escuro: garante contraste sobre o âmbar */
    --glass-hi:rgba(8,18,38,.72);
    --edge:rgba(255,255,255,.18);
    --rule:rgba(255,255,255,.10);
    --ink:#F4F7FB; --ink-2:#C3CFE0;
    --ok:#6EE7A8; --bad:#FF9B93;
    --stand-red:#C62A30; --stand-green:#1D7F47;
    --sel:rgba(47,107,255,.38);
    --r-lg:18px; --r-md:12px;
    --head:rgba(8,18,38,.88); --solid:#0E2140; --switch-off:rgba(255,255,255,.22);
    --press:rgba(255,255,255,.08); --hover:rgba(255,255,255,.06);
    --toast:rgba(16,58,40,.78); --toast-edge:rgba(110,231,168,.45);
    --toast-err:rgba(80,18,18,.8); --toast-err-edge:rgba(255,155,147,.5);
    --bg:
      radial-gradient(60vmax 45vmax at 105% -5%, rgba(245,165,36,.85), rgba(245,165,36,0) 70%),
      radial-gradient(55vmax 50vmax at -15% 110%, rgba(47,107,255,.75), rgba(47,107,255,0) 70%),
      var(--night);
  }
  /* Modo de dia: vidro claro e texto escuro para ler ao sol na placa (07:00–18:59) */
  :root[data-theme=day]{
    --glass:rgba(255,255,255,.68); --glass-hi:rgba(255,255,255,.86);
    --edge:rgba(11,27,51,.16); --rule:rgba(11,27,51,.10);
    --ink:#0B1B33; --ink-2:#44546B;
    --ok:#0A6334; --bad:#9F1D14;
    --sel:rgba(47,107,255,.16);
    --head:rgba(255,255,255,.92); --solid:#FFFFFF; --switch-off:rgba(11,27,51,.22);
    --press:rgba(11,27,51,.08); --hover:rgba(11,27,51,.05);
    --toast:rgba(222,246,232,.92); --toast-edge:rgba(15,122,67,.45);
    --toast-err:rgba(253,228,226,.94); --toast-err-edge:rgba(180,35,24,.45);
    --bg:
      radial-gradient(60vmax 45vmax at 105% -5%, rgba(245,165,36,.55), rgba(245,165,36,0) 70%),
      radial-gradient(55vmax 50vmax at -15% 110%, rgba(47,107,255,.35), rgba(47,107,255,0) 70%),
      #E6ECF5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:"Barlow Semi Condensed",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-weight:500;color:var(--ink);line-height:1.3;
    background:var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .container{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
    padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px;flex-shrink:0;}
  h1{font-size:1.75rem;font-weight:700;letter-spacing:.01em;margin:0;}
  #updated{font-size:.95rem;color:var(--ink-2);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;}
  #updated:empty{display:none;}
  .glass{background:var(--glass);border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass{background:var(--glass-hi);} }
  @media (prefers-reduced-transparency:reduce){ .glass{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none;} }
  .toolbar{display:flex;gap:10px;margin-bottom:12px;align-items:stretch;flex-shrink:0;}
  .search-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center;border-radius:var(--r-md);}
  input[type=search]{-webkit-appearance:none;appearance:none;background:transparent;border:0;color:var(--ink);
    padding:13px 46px 13px 16px;width:100%;font:inherit;font-size:1.15rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r-md);}
  input[type=search]::placeholder{color:var(--ink-2);text-transform:none;letter-spacing:0;font-weight:500;}
  input[type=search]::-webkit-search-cancel-button{display:none;}
  #clearBtn{position:absolute;right:4px;width:40px;height:40px;background:none;border:none;color:var(--ink-2);font-size:26px;line-height:1;cursor:pointer;border-radius:10px;}
  #refreshBtn{font:inherit;font-size:1.05rem;font-weight:600;color:var(--ink);padding:0 16px;border-radius:var(--r-md);cursor:pointer;white-space:nowrap;}
  #refreshBtn[aria-busy=true]{color:var(--ink-2);}
  .filter-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 10px;border-radius:var(--r-md);font-size:.85rem;color:var(--ink-2);cursor:pointer;}
  .ios-switch{position:relative;display:inline-block;width:46px;height:28px;}
  .ios-switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;}
  .slider{position:absolute;inset:0;background:var(--switch-off);transition:background .2s;border-radius:28px;pointer-events:none;}
  .slider:before{position:absolute;content:"";height:24px;width:24px;left:2px;top:2px;background:#fff;transition:transform .2s;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.35);}
  input:checked + .slider{background:#2FBF71;}
  input:checked + .slider:before{transform:translateX(18px);}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .search-wrap:focus-within{border-color:rgba(245,165,36,.7);}
  .search-wrap input:focus-visible{outline:none;}
  .table-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-lg);min-height:0;}
  table{width:100%;border-collapse:collapse;font-size:1.05rem;font-variant-numeric:tabular-nums;}
  th,td{padding:11px 4px;text-align:center;border-bottom:1px solid var(--rule);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;padding-left:12px;}
  th:last-child,td:last-child{padding-right:12px;}
  th{font-size:.85rem;font-weight:600;color:var(--ink-2);position:sticky;top:0;z-index:1;background:var(--head);}
  td strong{font-weight:700;letter-spacing:.02em;}
  tbody tr{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  tbody tr:active{background:var(--press);}
  @media (hover:hover){ tbody tr:hover{background:var(--hover);} }
  tr.selected,tr.selected:hover{background:var(--sel);}
  .remarks{font-size:.85rem;font-weight:600;}
  .remarks.ARRIVED{color:var(--ok);} .remarks.CANCELED{color:var(--bad);}
  .stand-red span,.stand-green span{display:inline-block;min-width:2.6em;color:#fff;font-weight:700;border-radius:6px;padding:2px 6px;}
  .stand-red span{background:var(--stand-red);} .stand-green span{background:var(--stand-green);}
  .no-results,.loading{padding:28px 16px;text-align:center !important;color:var(--ink-2);white-space:normal;line-height:1.45;}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    color:var(--ink);padding:12px 18px;border-radius:var(--r-md);font-weight:600;display:none;z-index:1000;
    background:var(--toast);border-color:var(--toast-edge);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .toast.err{background:var(--toast-err);border-color:var(--toast-err-edge);}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Chegadas</h1>
    <span id="updated" class="glass" aria-live="polite"></span>
  </header>
  <div class="toolbar">
    <div class="search-wrap glass">
      <input type="search" id="search" placeholder="Pesquisar" aria-label="Pesquisar" autocorrect="off" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button id="clearBtn" aria-label="Limpar pesquisa">×</button>
    </div>
    <button id="refreshBtn" class="glass">Atualizar</button>
    <label class="filter-box glass">
      <span>Filtrar</span>
      <span class="ios-switch">
        <input type="checkbox" id="filterToggle" checked aria-label="Filtrar stands e origens">
        <span class="slider"></span>
      </span>
    </label>
  </div>
  <div class="table-wrap glass">
    <table id="flightsTable"><thead><tr><th>Voo</th><th>Origem</th><th>Matrícula</th><th>Stand</th><th>ATA</th><th>Estado</th></tr></thead><tbody id="tbody"><tr><td colspan="6" class="loading">A ler o FLIC…</td></tr></tbody></table>
  </div>
</div>
<div class="toast glass" id="toast" role="status"></div>
<script>
const PROXY='https://proxy.cors.dev/';
const FLIC_URL='https://flic.tap.pt/FLIC_UI/FLIC.aspx?id=CPOR-LISC1-12h_ARR';
const ANA_URL='https://busdriverlis.ana.pt/pt/bus-driver/search';
const HIDDEN_STANDS=['141','142','143','144','145','146','147','114','115','116','117','122','123','124','125','126'];
const GREEN_STANDS=['200','201','202','203','204','205','206','207','208','209'];
const HIDDEN_ORIGINS=['YYZ','BOS','IAD','MIA','EWR','LAX','JFK','LHR','DUB','DXB'];
let allFlights=[],selected=null,filterActive=true,searchTimeout=null;
function applyTheme(){const h=new Date().getHours(),day=h>=7&&h<19;document.documentElement.dataset.theme=day?'day':'night';document.querySelector('meta[name=theme-color]').content=day?'#E6ECF5':'#0B1B33';}
applyTheme();setInterval(applyTheme,5*60*1000);
async function loadFlights(){const tbody=document.getElementById('tbody');const btn=document.getElementById('refreshBtn');btn.setAttribute('aria-busy','true');btn.textContent='A atualizar…';if(!allFlights.length)tbody.innerHTML='<tr><td colspan="6" class="loading">A ler o FLIC…</td></tr>';try{const response=await fetch(PROXY+FLIC_URL);if(!response.ok)throw new Error('HTTP '+response.status);const html=await response.text();const dateMatch=html.match(/(\d{2})(\w{3})(\d{2})\s+(\d{2}):(\d{2})/);let pageDate=new Date();if(dateMatch){const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};const day=parseInt(dateMatch[1]),mon=months[dateMatch[2]]??new Date().getMonth(),year=2000+parseInt(dateMatch[3]);pageDate=new Date(year,mon,day);}const parser=new DOMParser(),doc=parser.parseFromString(html,'text/html'),rows=Array.from(doc.querySelectorAll('tr')),flights=[];for(const tr of rows){const cells=Array.from(tr.querySelectorAll('td')).map(td=>td.innerText.trim());if(cells.length>=4&&cells[0]&&cells[1]&&/^[A-Z0-9]{2,3}$/.test(cells[0])&&/^\d+$/.test(cells[1])){const sta=cells[6]||'',eta=cells[7]||'',ata=cells[8]||'';const timeStr=ata||eta||sta;let flightTime=null;if(timeStr&&/^\d{2}:\d{2}$/.test(timeStr)){const [h,m]=timeStr.split(':').map(Number);flightTime=new Date(pageDate);flightTime.setHours(h,m,0,0);const now=new Date();if(flightTime.getTime()>now.getTime()+12*60*60*1000){flightTime.setDate(flightTime.getDate()-1);}}flights.push({airline:cells[0],number:cells[1],origin:cells[2]||'',registration:cells[3]||'',eqt:cells[4]||'',stand:cells[5]||'',sta,eta,ata,remarks:cells[9]||'',link:cells[10]||'',std:cells[11]||'',fullFlight:cells[0]+cells[1],flightTime});}}const now=new Date(),cutoff=new Date(now.getTime()-3*60*60*1000);allFlights=flights.filter(f=>!f.flightTime||f.flightTime>=cutoff);renderTable(getFiltered());document.getElementById('updated').textContent='Atualizado às '+now.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});}catch(err){if(allFlights.length){showToast('Não foi possível atualizar ('+err.message+'). A mostrar dados anteriores.',true);}else{tbody.innerHTML=`<tr><td colspan="6" class="no-results">Não foi possível ler o FLIC (${err.message}).<br>Toca em Atualizar para tentar de novo.</td></tr>`;}}finally{btn.removeAttribute('aria-busy');btn.textContent='Atualizar';}}
function renderTable(list){
  const tbody=document.getElementById('tbody');
  if(!list||list.length===0){const q=document.getElementById('search').value.trim().replace(/[<>&"]/g,'');const hint=q?`Nenhum voo com «${q}».<br>`+(filterActive?'Desliga o filtro ou limpa a pesquisa.':'Limpa a pesquisa para ver todos.'):(filterActive?'Sem voos nas últimas horas.<br>Desliga o filtro para ver os stands e origens escondidos.':'Sem voos nas últimas horas.');tbody.innerHTML=`<tr><td colspan="6" class="no-results">${hint}</td></tr>`;return;}
  const maxRows=80;
  const toShow=list.slice(0,maxRows);
  const frag=document.createDocumentFragment();
  toShow.forEach((f,i)=>{
    const tr=document.createElement('tr');
    tr.dataset.idx=i;
    if(selected&&selected.fullFlight===f.fullFlight)tr.classList.add('selected');
    const stand=String(f.stand||'').trim();
    let standClass='';
    if(HIDDEN_STANDS.includes(stand))standClass='stand-red';
    else if(GREEN_STANDS.includes(stand))standClass='stand-green';
    tr.innerHTML=`<td><strong>${f.fullFlight||''}</strong></td><td>${f.origin||''}</td><td>${f.registration||'—'}</td><td class="${standClass}">${standClass?`<span>${f.stand}</span>`:(f.stand||'')}</td><td>${f.ata||''}</td><td class="remarks ${f.remarks||''}">${f.remarks||''}</td>`;
    frag.appendChild(tr);
  });
  tbody.innerHTML='';
  tbody.appendChild(frag);
  if(list.length>maxRows){
    const more=document.createElement('tr');
    more.innerHTML=`<td colspan="6" class="no-results">A mostrar ${maxRows} de ${list.length}. Pesquisa para encontrar os restantes.</td>`;
    tbody.appendChild(more);
  }
}
let toastTimer=null;function showToast(msg,isErr){const toast=document.getElementById('toast');toast.textContent=msg;toast.classList.toggle('err',!!isErr);toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',isErr?3500:1500);}
function selectFlight(f,tr){
  selected=f;
  document.querySelectorAll('#tbody tr.selected').forEach(r=>r.classList.remove('selected'));
  if(tr)tr.classList.add('selected');
  const text=`${f.fullFlight}|${f.registration||''}|${f.origin||''}`;
  navigator.clipboard.writeText(text).then(()=>{
    showToast(`Copiado: ${text}`);
  }).catch(()=>{
    showToast('Não foi possível copiar. Tenta de novo.',true);
  });
  // Abrir diretamente no gesto do utilizador para o Safari não bloquear
  window.open(ANA_URL,'_blank');
}
function getFiltered(){
  let list=allFlights;
  if(filterActive){
    list=list.filter(f=>!HIDDEN_STANDS.includes(String(f.stand||'').trim())&&!HIDDEN_ORIGINS.includes(String(f.origin||'').trim().toUpperCase()));
  }
  const searchEl=document.getElementById('search');
  const q=(searchEl?searchEl.value:'').toUpperCase().trim();
  if(!q)return list;
  // Com exatamente 3 caracteres: fim da matrícula, origem ou voo
  if(q.length===3){
    return list.filter(f=>{
      const reg=(f.registration||'').toUpperCase();
      const origin=(f.origin||'').toUpperCase();
      const flight=(f.fullFlight||'').toUpperCase();
      return reg.slice(-3)===q||origin===q||flight.includes(q);
    });
  }
  // Para outras pesquisas, coloca matches no topo
  const matches=[], others=[];
  list.forEach(f=>{
    const flight=(f.fullFlight||'').toUpperCase();
    const origin=(f.origin||'').toUpperCase();
    const reg=(f.registration||'').toUpperCase();
    const remarks=(f.remarks||'').toUpperCase();
    const isMatch=flight.includes(q)||origin.includes(q)||reg.includes(q)||remarks.includes(q);
    if(isMatch) matches.push(f);
    else others.push(f);
  });
  return [...matches, ...others];
}
function doSearch(){
  clearTimeout(searchTimeout);
  renderTable(getFiltered());
}
document.getElementById('tbody').addEventListener('click',e=>{const tr=e.target.closest('tr');if(!tr||!tr.dataset.idx)return;const idx=parseInt(tr.dataset.idx,10),list=getFiltered();if(list[idx])selectFlight(list[idx],tr);});
const searchInput=document.getElementById('search');
searchInput.addEventListener('input',()=>{
  searchInput.value=searchInput.value.toUpperCase();
  const q=searchInput.value.trim();
  // Só atualiza automaticamente com 3 letras (matrícula) ou quando limpa
  if(q.length===3||q.length===0){
    clearTimeout(searchTimeout);
    searchTimeout=setTimeout(doSearch,100);
  }
});
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    doSearch();
    searchInput.blur();
  }
});
document.getElementById('clearBtn').addEventListener('click',()=>{searchInput.value='';doSearch();searchInput.focus();});
document.getElementById('filterToggle').addEventListener('change',e=>{filterActive=e.target.checked;doSearch();});
document.getElementById('refreshBtn').addEventListener('click',()=>{loadFlights();});
loadFlights();
</script>
</body>
</html>
